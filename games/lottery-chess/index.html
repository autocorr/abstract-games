<template id="rules">
  <p>
    In <i>Lottery Chess</i>, a marble drawn each turn may win you a piece for your hand, which you can later drop onto the board as in <i>Crazyhouse</i> and <i>Shogi</i>.
    All the rules of <i>Chess</i> apply, except as described below.
  </p>
  <h3>Materials</h3>
  <p>
    Each player has their own see-through bag of seven marbles, two white and five black, and there is one ten-sided die.
  </p>
  <h3>To Start</h3>
  <p>
    Set up the pieces as in <i>Chess</i>, with both hands empty.
    Decide who will move first.
    The first player takes the white pieces (“White”) and the second player takes the black pieces (“Black”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, <i>draw</i> a marble from your bag, and then either make a <i>Chess</i> move or <i>drop</i> a piece from your hand.
  </p>
  <p>
    <b>Draw:</b> Every turn starts with a draw, except White's first, which has no draw to offset the advantage of moving first.
    Black wins nothing.
    White wins a piece: roll the die and put the piece in your hand: 1–4 a Pawn, 5–6 a Knight, 7–8 a Bishop, 9 a Rook, 10 a Queen.
    Drawn marbles stay out until all seven are drawn, and then the bag is refilled.
  </p>
  <p>
    <b>Drop:</b> Drop one piece from your hand onto any empty square, including a piece won this turn.
    Your hand is shown beside the board (Black's above, White's below), with a count on each piece you hold; click a piece there and then a square.
    As in <i>Crazyhouse</i>, a Pawn may not be dropped on the first or last rank, a drop may give check or even checkmate, and like any move it may not leave your own King in check.
    A Pawn dropped on its second rank may still make its double step.
    A dropped Rook gives no right to castle.
    Unlike <i>Crazyhouse</i>, <b>captured pieces leave the game</b>: only the lottery fills your hand.
  </p>
  <p>
    <b>Check:</b> A player in check still draws first, and a piece won that turn may be dropped to block the check.
  </p>
  <h3>Winning</h3>
  <p>
    You win by checkmate, which is only decided once the defender has drawn: you lose if you have no legal move after your draw.
    Stalemate is a draw, as is 50 moves each without a capture, a Pawn move or a Pawn drop.
    There is no draw by repetition.
  </p>
</template>
