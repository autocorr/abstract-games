<template id="rules">
  <p>
    In <i>Shaolin King</i>, each King is replaced by a Shaolin Master that turns over every time it moves, alternating between a Queen and a Cannon.
    All the rules of <i>Chess</i> apply, except as described below.
  </p>
  <h3>To Start</h3>
  <p>
    Set up the pieces as in <i>Chess</i>, with an upright Master in place of each King.
    Decide who will move first.
    The first player takes the white pieces (“White”) and the second player takes the black pieces (“Black”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns, moving as in <i>Chess</i>.
  </p>
  <p>
    <b>The Master:</b> Upright (an upright King), it moves as a Queen.
    Turned over (an upside-down King), it moves as a <i>Cannon</i> along Queen lines: along a line it hops exactly one piece of either color, at any distance, and then moves to any empty square beyond it, or captures the first piece beyond it if that is an enemy piece.
    A turned-over Master with nothing to hop, or nowhere to go past its hurdle, cannot move.
    <b class="key">After every move the Master turns over</b>, so it alternates between the two.
    The Cannon is the Cannon of <i>Janggi</i> (Korean chess) along Queen lines, the move of the Quetzal in <i>Chak</i>.
  </p>
  <p>
    <b>Check:</b> The Master is the King of this game: you may not leave it attacked, and a Master attacked with no way out is checkmated.
    Each Master attacks by the face it shows, so one Master can check, and even mate, the other.
    Masters may even stand side by side when neither attacks the other's square, such as two turned-over Masters.
  </p>
  <p>
    <b>Castling:</b> As in <i>Chess</i>: the Master and Rook have not moved, the squares between them are empty, and the Master is not in check and does not pass through or land on an attacked square.
    The Master ends two squares toward the Rook with the Rook beside it.
    Unlike any other move, castling does not turn the Master over: it keeps its current side.
    Since an upright Master could also just move two squares along the rank, castle by moving the Master onto its own Rook.
  </p>
  <h3>Winning</h3>
  <p>
    You win by checkmating the opposing Master.
    Stalemate is a draw, as is 50 moves each without a capture or a Pawn move.
    There is no draw by repetition.
  </p>
  <h3>Options</h3>
  <p>
    Each side may be given another pair of faces, upright first: Queen / Cannon (the Shaolin Master, the default), King / Queen, King / Knight, King / Nightrider (a Knight that keeps leaping in the same direction while the squares are empty) or Rook / Bishop.
    Every pair is drawn as an upright King and an upside-down King.
    Random Masters deals the pairs at random at the start: Symmetric gives both sides the same pair, Asymmetric draws one for each.
    Master moves in Setup shows a letter at the corner of each Master for the way it moves now (C for Cannon, NN for Nightrider).
  </p>
</template>
