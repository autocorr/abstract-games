<template id="rules">
  <p>
    <i>Liquefaction</i> is from <i>Bag of Tricks</i> by Brian E. Svoboda (CC BY-SA 4.0).
    It is <i>Chess</i> without Queens on a board shaded in four colors, where a marble drawn each turn says which squares your King must avoid.
  </p>
  <h3>Materials</h3>
  <p>
    The squares come in four colors, two dark and two light.
    A supply holds five marbles of each color, and a bag holds five of them.
    Everything is in view: the bag is see-through.
  </p>
  <h3>To Start</h3>
  <p>
    On 6×6 each side has six Pawns, two Knights and two Bishops (Knight, Bishop, empty, King, Bishop, Knight), with no Pawn double step, no en passant and no castling.
    On 8×8 each side has the usual pieces minus the Queen, whose square starts empty, and the normal Pawn and castling rules.
    Decide who will move first.
    The first player takes the white pieces (“White”) and the second player takes the black pieces (“Black”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, <i>draw</i> a marble, and then make your <i>move</i>.
  </p>
  <p>
    <b>Draw:</b> Squares of the drawn color are <i>color-checked</i> for your King this turn, and are hatched on the board.
    After your move, <b>your King may not stand on one</b>, just as it may not stand in check.
    If your King is already on that color, it must move off.
  </p>
  <p>
    <b>Move:</b> Move as in <i>Chess</i>.
    The drawn marble goes back to the supply, and a marble of the color of the square your piece landed on goes into the bag.
    So the bag keeps five marbles, but its mix changes.
  </p>
  <p>
    <b>Castling (8×8):</b> You may not castle while color-checked, and the King may not land on the drawn color, but it may pass over it.
    The marble added is the color of the King's new square.
  </p>
  <p>
    <b>Promotion:</b> Pawns promote to a Knight, Bishop or Rook.
  </p>
  <h3>Winning</h3>
  <p>
    You lose if you have no legal move after your draw.
    That covers checkmate, a King that cannot leave the drawn color, and stalemate, which is a loss here.
    The game is a draw after 50 moves each without a capture or a Pawn move.
    There is no draw by repetition.
  </p>
</template>
