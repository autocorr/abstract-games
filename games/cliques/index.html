<template id="rules">
  <p>
    In <i>Cliques</i>, the stones on the board form separate clusters, and each cluster goes to whoever has the largest group in it.
    A minimum number of clusters must always remain, so every join has to be paid for with a split.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a hexagon of hexagonal cells.
    In the standard start, the six corner cells hold stones of alternating colors, three black and three white; the board can also begin empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, either <i>place</i> a stone and then you may <i>pull</i> one, or <i>claim</i> a tied cluster.
  </p>
  <p>
    <b>Groups and clusters:</b> A <i>group</i> is a set of connected stones of one color.
    A <i>cluster</i> is a set of connected stones of either color.
    A cluster is <i>decided</i> for the player whose largest group in it is larger.
    If both players' largest groups in a cluster are the same size, the cluster is <i>tied</i>.
  </p>
  <p>
    <b>Place:</b> Place a stone of your color on an empty cell.
  </p>
  <p>
    <b>Pull:</b> Then you may pull one of your other stones.
    It moves in a straight line along one of the six directions, through empty cells only, and may stop on any cell where it ends up in the same group as the stone you placed.
    It may come from that group itself, provided it still ends up connected to the placed stone.
    To pull, click the placed stone's cell, then the stone to pull, then its destination.
    To skip the pull, click the placed stone's cell a second time.
  </p>
  <p>
    <b>Claim:</b> Instead of placing, you may claim a tied cluster that is not already claimed.
    The cluster is then decided for you, and gray dots mark the largest group or groups you claimed it with.
    A claim lasts as long as the cluster stays tied.
    It lapses if either player's largest group there grows or shrinks so that the tie is broken.
    It also lapses if the cluster splits, or if it merges with another claimed cluster, in which case both claims lapse.
    To claim, click the yellow dot on the cluster.
  </p>
  <p>
    <b>Opening:</b> While there are fewer clusters than the set minimum, as at the start, every turn must increase the number of clusters.
  </p>
  <p>
    <b>Minimum clusters:</b> Once the minimum is reached, <b>there must be at least that many clusters after every turn</b>.
    The count is checked after the pull, so a placement that joins two clusters is allowed if the pull splits one apart again.
  </p>
  <p>
    The game ends when you have no legal placement or claim.
  </p>
  <h3>Winning</h3>
  <p>
    You win if more clusters are decided for you than for your opponent.
    There are no draws.
  </p>
  <h3>Swap Rule</h3>
  <p>
    On White's first turn, White may swap instead of moving: every stone on the board changes color, and Black moves next.
  </p>
  <h3>Options</h3>
  <p>
    Board side 3 to 7, minimum clusters 3, 5, 7 or 9, and a corner or empty start.
  </p>
  <h3>Tips</h3>
  <p>
    In the opening, every turn is a stone that touches no other stone, with no pull and no claim.
  </p>
</template>
