<template id="rules">
  <p><i>A work in progress: the rules are still being balanced.</i></p>
  <p><b>Setup.</b> The board is a hexagon of hexagonal cells, 4 to 7 cells per side. Each player starts with chickens (triangles) on corners of the board: one each on opposite corners, or three each on alternating corners. The cells they stand on are their own. White moves first.</p>
  <p><b>Turn.</b> Move one of your chickens. With <i>Slide</i> movement it moves any distance in a straight line over empty cells; with <i>Step</i> movement, to a neighboring cell. It must land on either</p>
  <ul>
    <li>an empty cell nobody owns, which becomes yours, or</li>
    <li>an opponent's chicken, which is captured; its cell becomes yours.</li>
  </ul>
  <p>Eggs of either color cannot be captured and block movement. An empty cell someone owns (left behind by a capture) can be crossed but not landed on.</p>
  <p><b>Eggs.</b> A chicken that moves without capturing lays an egg (a disc) on the cell it left. A capture lays no egg. An egg shows how many of its owner's turns remain until it hatches, starting at 3 (Hatch after in Setup). It counts down at the start of each of its owner's turns and hatches at 0 into a chicken that can move that same turn.</p>
  <p><b>Passing.</b> A player with no move passes.</p>
  <p><b>End.</b> A player with no chickens and no eggs left loses at once. Otherwise the game ends when neither player can move and no eggs remain, and the player who owns more cells wins. Equal counts are a draw.</p>
  <p><b>Why it ends.</b> Every move without a capture claims a new cell, and every capture removes a chicken without laying an egg, so the game cannot go on forever.</p>
  <p><b>Swap.</b> With the swap rule on, after White's first move Black may swap instead of moving: White's pieces and cells become Black's, and White moves next.</p>
</template>
