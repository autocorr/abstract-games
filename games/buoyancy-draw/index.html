<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buoyancy</title>
<meta name="color-scheme" content="dark light">
<link rel="preload" href="../../common/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>

<body>

<template id="rules">
  <p>
    In <i>Buoyancy</i>, a run of lucky draws can give you several actions in one turn.
    Stacks carrying enemy checkers float back toward your own edges, where you bear them off to capture them.
  </p>
  <h3>Materials</h3>
  <p>
    One bag is shared by both players.
    It starts with 15 white and 5 black marbles (both counts can be changed in Setup).
    Drawn marbles stay out of the bag; when it is empty, all of them go back in.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a 6×6 chessboard turned 45 degrees into a diamond.
    Decide who will move first.
    The first player takes the white checkers (“White”) and the second player takes the black checkers (“Black”).
    White's edges are the two lower sides, and Black's the two upper sides; the left and right corners lie on both.
    Each player starts with a checker on each of the 15 cells nearest their corner (the five rows below or above the middle row), and the middle row starts empty.
    Your <i>house</i> is the nearest three of those rows, six cells.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, draw marbles one at a time until you draw a black one.
    Each white marble you drew gives you one action: <i>move</i>, <i>bear off</i> or <i>place</i>.
    <b class="key">You must take all of those actions</b>; your turn ends early only if no action is possible.
  </p>
  <p>
    <b>Stacks:</b> Whoever's checker is on top controls a stack; a single checker is a stack too.
    A stack holding any of your opponent's checkers moves backward, toward your edges.
    Any other stack moves forward.
  </p>
  <p>
    <b>Move:</b> Move a stack you control one diagonal step, forward or backward as above, onto an empty cell or onto your opponent's stack, capping it, but not onto a stack you control.
  </p>
  <p>
    <b>Bear off:</b> Step a stack carrying your opponent's checkers off the board past one of your edges, as if there were a square there.
    Your opponent's checkers in it are captured, and your own go to your reserve.
    To step a stack off the board, click it twice (once, if it has no other move).
  </p>
  <p>
    <b>Place:</b> Place a checker from your reserve on a cell of your house, either empty or capping an opposing stack.
    If you control every cell of your house, your reserve waits.
  </p>
  <p>
    <b>Surrender:</b> A single checker may stand on your opponent's edge.
    It may step off the board past that edge, as an action, only when it has no forward step open on the board, and then your opponent captures it.
  </p>
  <h3>Winning</h3>
  <p>
    You win if you capture all of your opponent's checkers.
    You also win as soon as your opponent controls no stack and has no checker in reserve: every checker they have left is under your caps, and they could never move again.
  </p>
</template>

<script type="module">
  import { mount } from "../../common/shell.js";
  import game from "./game.js";
  window.app = mount(game);
</script>
</body>
</html>
