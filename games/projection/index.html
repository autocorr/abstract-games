<template id="rules">
  <p>
    <i>Projection</i> adapts <i>Go</i> to a triangular grid, drawn here as the corners of hexagons.
    Stones must be placed where a friendly stone can “see” them, and stones block each other's lines of sight.
  </p>
  <h3>To Start</h3>
  <p>
    Play on the corners of the hexagons, called <i>points</i>.
    Two points are neighbors when a hexagon's edge joins them.
    The board begins empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
    Black places one black stone and one white stone on any vacant points.
    White then either moves first or <i>swaps</i>: both stones change color, and Black moves first instead.
    This opening is also called a <i>two-stone pie offer</i>.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, either <i>project</i> a stone or pass.
  </p>
  <p>
    <b>Project:</b> Place a stone of your color on a vacant point along a ray from one of your stones, provided there are <b>no stones in between</b>.
    Each stone has three rays, which start toward its neighbors and run straight on through the hexagons' centers, along the faint lines.
    The points you can project onto are marked.
  </p>
  <p>
    <b>Captures:</b> Stones of one color joined through neighbors form a <i>group</i>, and its vacant neighboring points are its <i>liberties</i>.
    After you project, remove any enemy groups with no liberties, and then your own group if it has none.
  </p>
  <p>
    <b>No repeats:</b> You may not project a stone that recreates an earlier position of the board (the <i>ko</i> rule).
  </p>
  <p>
    The game ends when both players pass in a row.
  </p>
  <h3>Winning</h3>
  <p>
    Your score is the number of your stones on the board plus the vacant points in regions that border only your stones.
    Stones are not removed at the end: capture any that cannot be saved before you pass.
    You win if you have the higher score.
    Small stones mark each player's vacant points at the end.
    If the scores are tied then the player who passed first wins.
  </p>
  <h3>Options</h3>
  <p>
    The board's sides alternate between two lengths, from 2 and 3 hexagons up to 5 and 6, set in Setup.
    The default is 3 and 4.
  </p>
  <h3>Tips</h3>
  <p>
    A wall of your stones blocks your opponent's rays, so the points behind it are hard for them to reach.
    Try to keep lines of sight open into the areas you want to claim.
    Be careful, though: your own stones block your rays too!
  </p>
</template>

</html>
