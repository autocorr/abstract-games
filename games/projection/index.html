<template id="rules">
  <p>
    <i>Projection</i> adapts <i>Go</i> to the corners of a board of hexagons.
    Every stone must be placed where a friendly stone can “see” it, and stones block each other's lines of sight.
  </p>
  <h3>To Start</h3>
  <p>
    Play on the corners of the hexagons, called <i>points</i>.
    Two points are neighbors when a hexagon's edge joins them, so each point has three neighbors, or two on the edge of the board.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
    Black places one black stone and then one white stone on any vacant points.
    White may then swap instead of moving: both stones change color, and Black moves first instead.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns, with White moving first.
    On your turn, either <i>project</i> a stone or pass.
  </p>
  <p>
    <b>Project:</b> Place a stone of your color on a vacant point along a ray from one of your stones, provided there are <b>no stones in between</b>.
    Each stone has three rays, which start toward its three neighbors and run straight on across the board, through the hexagons' centers along the faint lines.
    The points you can project onto are marked.
  </p>
  <p>
    <b>Capture:</b> A group is a set of stones of one color joined through neighbors.
    After you project, remove any enemy groups with no vacant neighbors, and then your own group if it has none.
  </p>
  <p>
    <b>Ko:</b> You may not project a stone that recreates an earlier position of the board.
  </p>
  <h3>Winning</h3>
  <p>
    The game ends when both players pass in a row.
    Your score is the number of your stones on the board plus the vacant points in regions that border only your stones.
    Stones are not removed at the end, so capture any that cannot be saved before you pass.
    You win if you have the higher score.
    If the scores are tied, the player who passed first wins.
    Small stones mark each player's vacant points at the end.
  </p>
  <h3>Options</h3>
  <p>
    The board's sides alternate between two lengths, from 2 and 3 hexagons up to 5 and 6 (3 and 4 by default), set in Setup.
  </p>
  <h3>Tips</h3>
  <p>
    A wall of your stones blocks your opponent's rays, so the points behind it are hard for them to reach.
  </p>
</template>
