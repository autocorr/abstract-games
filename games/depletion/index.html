<template id="rules">
  <p>
    <i>Depletion</i> is a connection game like <i>Hex</i>, but a marble drawn from a bag decides which colored region of the board you must play in.
  </p>
  <h3>Materials</h3>
  <p>
    A bag holds one marble of each region's color.
    Drawn marbles stay out of the bag until it is empty, and then all the marbles go back in.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a rhombus of hexagons divided into colored regions of about the same size, three to five depending on the options.
    The board begins empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
    Black's edges are the two opposite edges marked in black, and White's are the two marked in white.
    The corner cells belong to both edges they touch.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, draw a marble from the bag and set it aside, then place a stone of your color on any empty cell <b>in the region of the drawn color</b>.
    If that region is full, you must pass.
    With an odd number of colors, the player who draws first changes from one cycle to the next.
  </p>
  <h3>Winning</h3>
  <p>
    You win if a chain of your stones connects your two edges.
    As in <i>Hex</i>, the game cannot end in a draw.
  </p>
  <h3>Options</h3>
  <p>
    The board size, the number of colors, and the region layout (diagonal bands, long stripes, nested rhombi, pinwheel or patches) can all be changed in Setup.
  </p>
</template>
