<template id="rules">
  <p>
    <i>Determinant</i> is a connection game on the points of a square grid in which every cross-cut is settled by a marble draw.
  </p>
  <h3>Materials</h3>
  <p>
    A bag holds three white marbles and two black marbles.
    A drawn marble leaves the game, and a marble of the other color goes into the bag.
  </p>
  <h3>To Start</h3>
  <p>
    Play on the points of a square grid, as in <i>Go</i>.
    The board begins empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
    Black's edges are the top and bottom, and White's are the left and right.
    The corner points belong to both edges they touch.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, place a stone of your color on any empty point, and then resolve any <i>cross-cuts</i>.
  </p>
  <p>
    <b>Cross-cuts:</b> A cross-cut is a 2×2 square of points where two diagonally opposite points are black and the other two are white.
    If your placement makes one or more cross-cuts, draw one marble.
    Its color decides who resolves: a white marble means White, and a black marble means Black.
    The resolver replaces one of the opponent's stones in a cross-cut with a stone of their own color.
    That may resolve other cross-cuts, and it may make new ones.
    The resolver keeps replacing stones until no cross-cut is left on the board.
    There is <b>only one draw per turn</b>, however many cross-cuts there are.
  </p>
  <h3>Winning</h3>
  <p>
    You win if a chain of your stones connects your two edges.
    Stones are connected only when they are orthogonally adjacent, along a line; diagonal neighbors are not connected.
    Wins are checked at the end of each turn, after all cross-cuts are resolved, so you can win even when it is not your turn.
    The game cannot end in a draw.
  </p>
  <h3>Swap Rule</h3>
  <p>
    On White's first turn, White may swap instead of placing a stone.
    Black's stone is reflected across the diagonal and becomes a white stone, the colors of the marbles in the bag are exchanged, and Black moves next.
  </p>
  <h3>Options</h3>
  <p>
    The board size can be set from 7×7 to 19×19 in Setup.
  </p>
  <h3>Tips</h3>
  <p>
    Winning a draw makes your color less likely next time, since the bag always holds five marbles.
  </p>
</template>
