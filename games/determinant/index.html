<template id="rules">
  <p><b>Goal.</b> Connect your two edges of the board with a chain of your stones. Black connects the top and bottom edges, and White connects the left and right edges. Stones are connected only when they are orthogonally adjacent, along a line. Diagonal neighbors are not connected. The corner points belong to both edges they touch.</p>
  <p><b>Board.</b> Stones are played on the points of a square grid, as in Go. The board starts empty. The bag holds three white marbles and two black marbles. Black moves first.</p>
  <p><b>Turn.</b> Place a stone of your color on any empty point.</p>
  <p><b>Cross-cuts.</b> A cross-cut is a 2×2 square of points where two diagonally opposite points are black and the other two are white. If your placement makes one or more cross-cuts, draw one marble. Its color decides who resolves: a white marble means White, and a black marble means Black. The resolver replaces one of the opponent's stones in a cross-cut with a stone of their own color. That may resolve other cross-cuts, and it may make new ones. The resolver keeps replacing stones until no cross-cut is left on the board. There is only one draw per turn, however many cross-cuts there are.</p>
  <p><b>The bag.</b> The drawn marble leaves the game, and a marble of the other color goes into the bag. The bag always holds five marbles, and winning a draw makes your color less likely next time.</p>
  <p><b>Swap.</b> On White's first turn, White may swap instead of placing a stone. Black's stone is reflected across the diagonal and becomes a white stone, the colors of the marbles in the bag are exchanged, and Black moves next. This is the same as the players trading sides after the first stone.</p>
  <p><b>End.</b> Wins are checked at the end of each turn, after all cross-cuts are resolved. The player whose edges are connected wins, even when it is not their turn. Both players can never be connected at once. Every turn ends with no cross-cuts, so the game cannot end in a draw.</p>
  <p><b>Options.</b> The board size can be set from 7×7 to 19×19 in Options.</p>
</template>
