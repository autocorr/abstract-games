<template id="rules">
  <p>
    In <i>Trivalent</i>, the players fill the board with stones, and each group scores for the edges it reaches.
    A group earns points only for stones on cells that match the color of an edge it touches.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a hexagon of hexagonal cells.
    Each pair of opposite edges has its own color, and the cells are checkered in lighter shades of the same three colors.
    The board begins empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, place a stone of your color on a vacant cell.
    Play stops when the board is full.
  </p>
  <h3>Winning</h3>
  <p>
    A <i>group</i> is a set of your stones connected through neighboring cells.
    For each of the six edges, every group that touches it scores a point for each of its stones on a cell of that edge's color.
    A group that touches several edges <b>scores separately for each edge</b>, and a corner cell lies on two edges.
    Groups that touch no edge score nothing.
    White adds a komi to their score.
    You win if you have the higher score.
  </p>
</template>

<script type="module">
