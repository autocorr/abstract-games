<body>

<template id="rules">
  <p>
    In <i>Filament</i>, an empty cell surrounded mostly by one color fills with the other, so a single placement can set off a cascade.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a patch of the Cairo pentagonal tiling where every cell has either three or five neighbors.
    Two cells are neighbors only if they share an edge; cells that touch only at a corner are not neighbors.
    The board begins empty.
    Decide who will move first.
    The first player takes the black stones (“Black”) and the second player takes the white stones (“White”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, <i>place</i> a stone, and then <i>fill</i> any cells with a majority.
  </p>
  <p>
    <b>Place:</b> Place a stone of your color on an empty cell.
  </p>
  <p>
    <b>Fill:</b> An empty cell has a <i>majority</i> when more than half of all its neighbors hold stones of one color: at least three of five for inner cells, or at least two of three for edge cells.
    Fill each such cell with a stone of the <b>opposite</b> color to the majority.
    Fills can create new majorities, so continue filling until none remain.
    Then your turn ends.
  </p>
  <p>
    Play stops when the board is full.
  </p>
  <h3>Winning</h3>
  <p>
    You win if you have fewer groups.
    Two of your stones are in the same <i>group</i> if you can trace a path between them that steps only from neighbor to neighbor through your own stones.
    A stone with no neighbors of its color is a group by itself.
  </p>
  <p>
    If the group counts are tied, each player lists their group sizes from largest to smallest.
    Compare the two lists one position at a time: first the largest groups, then the second largest, and so on.
    At the first position where the sizes differ, the player with the smaller group wins.
    If every size matches then the game is a draw.
  </p>
  <h3>Options</h3>
  <p>
    The board can have 48 or 160 cells.
  </p>
</template>

<script type="module">
