<body>

<template id="rules">
  <p>
    In <i>Grounded Chess</i>, every piece except the Pawns has a dark and a light side and turns over each time it moves.
    You must always keep at least one dark piece on the board.
    All the rules of <i>Chess</i> apply, except as described below.
  </p>
  <h3>To Start</h3>
  <p>
    Set up the pieces as in <i>Chess</i>, with every piece except the Pawns dark side up.
    Decide who will move first.
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, make a <i>Chess</i> move, and then turn over the piece that moved.
  </p>
  <p>
    <b>Two sides:</b> Both sides of a piece move and capture exactly as the <i>Chess</i> piece does.
    A piece turns over every time it lands, whether it moves or captures: dark becomes light, and light becomes dark.
    Castling turns over both the King and the Rook.
    Pawns have only one side and never turn over.
  </p>
  <p>
    <b>Stay grounded:</b> <b class="key">You must always have at least one dark piece on the board.</b>
    A move that would turn over your last dark piece is not allowed.
    Pawns do not count.
    The King counts while it is dark, but it does not have to be dark as long as another piece is.
  </p>
  <p>
    <b>Promotion:</b> A Pawn reaching the last rank promotes to a dark Queen, Rook, Bishop or Knight of your choice.
  </p>
  <p>
    <b>Check:</b> The King is royal on either side: check and checkmate are as in <i>Chess</i>.
  </p>
  <h3>Winning</h3>
  <p>
    You win by (<b>1</b>) checkmating the opposing King, or (<b>2</b>) capturing your opponent's last dark piece.
    If you have no legal move and are not in check, you are stalemated and lose.
    That includes having only moves that would turn over your last dark piece.
    The game is a draw after 50 moves each without a capture or a Pawn move, or when the same position occurs three times (the same player to move, with the same castling and en passant rights).
  </p>
</template>
