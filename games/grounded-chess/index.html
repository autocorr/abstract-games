<template id="rules">
  <p><b>Goal.</b> Checkmate the opposing King, or capture your opponent's last dark piece. The board, setup and moves are those of chess.</p>
  <p><b>Two sides.</b> Every piece except the pawns has two sides, dark and light. Both sides move and capture exactly as the chess piece does. All pieces start dark, and a piece turns over every time it lands, whether it moves or captures: dark becomes light, and light becomes dark. Castling turns over both the King and the Rook.</p>
  <p><b>Stay grounded.</b> You must always have at least one dark piece on the board. A move that would turn over your last dark piece is not allowed. If your opponent captures your last dark piece, you lose at once. Pawns have only one side, are drawn light, and do not count. The King counts while it is dark, but it does not have to be dark as long as another piece is.</p>
  <p><b>Promotion.</b> A pawn reaching the last rank promotes to a dark Queen, Rook, Bishop or Knight of your choice.</p>
  <p><b>Check and mate.</b> The King is royal on either side: check and checkmate are as in chess. If you have no legal move and are not in check, you are stalemated and lose. That includes having only moves that would turn over your last dark piece.</p>
  <p><b>Draws.</b> 50 moves each without a capture or a pawn move is a draw, as is the same position occurring three times (the same player to move, with the same castling and en passant rights).</p>
  <p><b>Colors.</b> Each player has a color, in a dark shade for the dark sides and a light shade for the light sides and the pawns. Pick a palette under Colors in Setup; the players are named after their colors.</p>
</template>
