<body>

<template id="rules">
  <p><b>Setup.</b> The board is a hexagon of hexagonal cells, 4 to 7 cells per side (37 to 127 cells, always an odd number). The board starts empty, and Black moves first. Play uses one four-sided die (d4).</p>
  <p><b>Rolling.</b> Roll the die. The first roll always counts. You may then stop, or roll again. A re-roll counts if it is greater than the roll before it, and you may again stop or roll. If it is equal or lower, you <i>bust</i>: your turn ends and you place nothing. Counting rolls must keep rising, so at most four count (1, 2, 3, 4), and after a 4 you must stop.</p>
  <p><b>Placing.</b> Stop by placing a stone: place one stone of your color on an empty cell for each roll that counted. If the board fills up first, the game ends. Stones never move. Each stone shows the size of its group (Group sizes in Setup hides the numbers), and outlines mark the stones placed in the latest turn.</p>
  <p><b>End.</b> The game ends when the board is full. Each player lists their group sizes from largest to smallest. Compare the two lists one position at a time: first the largest groups, then the second largest, and so on. At the first position where the sizes differ, the player with the larger group wins. The board has an odd number of cells, so there are no draws.</p>
  <p><b>Swap.</b> With the swap rule on, after Black's first turn, White may swap instead of rolling: Black's stones become white stones, and Black rolls next.</p>
</template>

<script type="module">
  import { mount } from "../../common/shell.js";
  import game from "./game.js";
  window.app = mount(game);
</script>
