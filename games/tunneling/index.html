<template id="rules">
  <p>
    In <i>Tunneling</i>, grasshoppers hop over pieces along Queen lines and leave a stone behind, so the board fills up until someone is stuck.
  </p>
  <h3>To Start</h3>
  <p>
    Each player has four grasshoppers, drawn as upside-down Queens, placed as chosen under Start in Setup.
    Decide who will move first.
    The first player takes the white grasshoppers (“White”) and the second player takes the black grasshoppers (“Black”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, <i>hop</i> one of your grasshoppers, and leave a <i>stone</i> on the square it left.
  </p>
  <p>
    <b>Hop:</b> A grasshopper moves along any of the eight lines a <i>Chess</i> Queen uses.
    It passes over any number of empty squares, hops the first piece it meets, and lands on the square just beyond it.
    That square must be on the board and empty.
    Any piece may be hopped: either player's grasshoppers, or stones.
    Nothing is captured.
  </p>
  <p>
    <b>Stones:</b> The square a grasshopper leaves gets a gray stone.
    Stones never move, belong to neither player and <b>stay for the rest of the game</b>.
  </p>
  <h3>Winning</h3>
  <p>
    You win if your opponent cannot move on their turn.
  </p>
  <h3>Options</h3>
  <p>
    Setup offers an 8×8 or 10×10 board and three starting positions: <i>Ring</i> (the published start), <i>Wide ring</i> (the same pattern a square further out) and <i>Diagonals</i> (the central 2×2 and the corners of the square around it).
  </p>
</template>
