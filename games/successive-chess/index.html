<template id="rules">
  <p>Chess, with these changes.</p>
  <p><b>Turns.</b> Roll a die, then move. You may then roll again: higher than your previous roll gives another move (and another chance to roll); equal or lower is a bust: remove one of your own pieces and your turn ends. A 6 ends your turn.</p>
  <p><b>Kings.</b> There is no check or checkmate. Capture the opposing King to win, but its owner first rolls a saving throw: equal to or higher than your current roll saves it, and your turn ends without the capture. Removing your own King loses.</p>
  <p><b>Other rules.</b> Having no legal move after a roll loses. En passant is only possible against the last move of the opponent's turn. The fifty-move rule counts every move by either player (100 in all); a saved capture counts as one. There is no draw by repetition.</p>
</template>

<script type="module">

  window.app = mount(game);
</script>
