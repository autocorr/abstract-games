<meta name="color-scheme" content="dark light">

<body>

<template id="rules">
  <p>
    <i>Wavefunction Collapse</i> is from <i>Bag of Tricks</i> by Brian E. Svoboda (CC BY-SA 4.0), inspired by James Ernest's <i>Hens and Chicks</i> and Dan Troyka's <i>Breakthrough</i>.
    A marble draw decides whether you move from a light or a dark square.
  </p>
  <h3>Materials</h3>
  <p>
    A see-through bag holds three white marbles, three black marbles and one gray marble.
  </p>
  <h3>To Start</h3>
  <p>
    Each side has 12 checkers on a chessboard.
    Your second rank is full, and your other four checkers stand on four of the eight squares of your back rank, chosen at random.
    Black's back rank is White's turned half a turn (<code>a1</code> matches <code>h8</code>, <code>b1</code> matches <code>g8</code>), so both sides have the same square colors.
    Decide who will move first.
    The first player takes the white checkers (“White”) and the second player takes the black checkers (“Black”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, <i>draw</i> a marble, and then <i>move</i> one checker on the drawn color.
  </p>
  <p>
    <b>Draw:</b> Draw a marble and set it aside, in order.
    On white, move a checker that stands on a light square; on black, one on a dark square.
    Gray takes the color of the last marble drawn, even from before a refill; if gray is the first draw of the game, move any checker.
    Once all seven marbles have been drawn, they all go back in the bag.
  </p>
  <p>
    <b>Move:</b> A checker moves one square diagonally forward, onto an empty square, so it always stays on its color.
  </p>
  <p>
    <b>Capture:</b> If your checker lands directly beside an opposing checker, to its left or right on the same rank, that checker is captured.
    Landing between two opposing checkers, one on each side, <b class="key">captures nothing</b>.
    Squares side by side are opposite colors, so checkers only capture, and are only captured by, checkers on the other color.
  </p>
  <p>
    <b>Passing:</b> If none of your checkers on the drawn color can move, you must pass.
  </p>
  <h3>Winning</h3>
  <p>
    You win as soon as one of your checkers reaches the far rank: rank 8 for White, rank 1 for Black.
    If none of your checkers can move at all, on either color, you are stalemated and lose.
  </p>
</template>

<script type="module">

  window.app = mount(game);
</script>
</body>
</html>
