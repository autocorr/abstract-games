<body>

<template id="rules">
  <p><b>Goal.</b> Cap two or three of the three scoring corners (darker while empty) when the game ends. You cap a stack when its top checker is yours.</p>
  <p><b>Board.</b> A triangle of hexagons, whose three corners score, or a hexagon of hexagons, where every other corner scores. The board starts empty, and Black moves first.</p>
  <p><b>Turn.</b> Roll two dice and take the difference between them.</p>
  <ul>
    <li><b>Zero</b> (a double): place a checker of your color on a vacant cell.</li>
    <li><b>One to five</b>: sow a stack you cap whose height equals the difference, and leave a new checker of yours on the cell it left.</li>
    <li>If you cap no stack of that height, <b>cap</b> one of your stacks with a new checker instead. If you cap no stack at all, place on a vacant cell.</li>
  </ul>
  <p><b>Sowing.</b> Lift the whole stack and drop its checkers one per cell along a path of as many steps as there are checkers, starting with the bottom checker on a neighbor of the stack's cell. Your capping checker is dropped last, on top at the end of the path, so it takes over whatever stack is there. Each step goes to a neighboring cell, vacant or occupied; the path may come back to cells it has already passed, including the one it started from, but never steps straight back to the cell it just left. To sow, click the stack and then each cell of the path. A stack of six or more can never be sown.</p>
  <p><b>Free sows.</b> Each player has one free sow (zero to four, set in Setup). Instead of the move your roll gives, you may spend it to sow any stack you cap of height one to five, whatever the dice show: click Free sow, then the stack and its path. A free sow cannot stand in for a placement you are unable to make: when your roll leaves you no legal move, such as a double with no vacant cell, the game ends even if you have free sows left. The panel shows how many each player has left.</p>
  <p><b>Swap.</b> After Black's first turn, White may swap instead of rolling: Black's opening checker becomes White's, and Black rolls next. The swap is decided before White sees the dice. It can be turned off in Setup.</p>
  <p><b>End.</b> No cell ever empties, so the board only fills. The game ends when the player to move has no legal move: a double when no cell is vacant. The board is then full, so every scoring corner is capped, and whoever caps the majority of them wins.</p>
  <p><b>Display.</b> A stack is drawn as a pile of bars, the bottom checker lowest, on a cell shaded white or grey for the player whose checker is on top; a stack of six or more, too tall to sow, has its height beside it. Setup offers two other styles: Capped, where the top checker is a wider bar, and Plain, bars alone. Dots mark the stacks you can sow or cap, and outlines the cells of the last move. The panel counts the scoring corners each player caps. Corner marks, lines wrapped round the scoring corners just off the board, can be shown in Setup.</p>
  <p><b>Options.</b> The board's shape and side, and the number of free sows, can be changed in Setup: a triangle of side 3 to 10, or a hexagon of side 3 to 6.</p>
</template>

<script type="module">
  import { mount } from "../../common/shell.js";
  import game from "./game.js";
  window.app = mount(game);
</script>
</body>
</html>
