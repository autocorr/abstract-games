<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broadcast</title>
<meta name="color-scheme" content="dark light">
<link rel="preload" href="../../common/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>

<body>

<template id="rules">
  <p>
    In <i>Broadcast</i>, dice decide which stack you sow across the board, and whoever's checker ends on top of a stack controls it.
  </p>
  <h3>Materials</h3>
  <p>
    Two dice.
  </p>
  <h3>To Start</h3>
  <p>
    Play on a triangle of hexagons, whose three corners score, or a hexagon of hexagons, where every other corner scores.
    The scoring corners are darker while empty.
    The board begins empty.
    Decide who will move first.
    The first player takes the black checkers (“Black”) and the second player takes the white checkers (“White”).
  </p>
  <h3>The Play</h3>
  <p>
    Alternate taking turns.
    On your turn, roll two dice and take the difference between them, then <i>place</i>, <i>sow</i> or <i>cap</i> as described below.
    A stack is one or more checkers on a cell, and you <i>cap</i> a stack when its top checker is yours.
  </p>
  <p>
    <b>Place:</b> On a zero (a double), place a checker of your color on a vacant cell.
  </p>
  <p>
    <b>Sow:</b> On one to five, sow a stack you cap whose height equals the difference, and leave a new checker of yours on the cell it left.
    Lift the whole stack and drop its checkers one per cell along a path of as many steps as there are checkers, starting with the bottom checker on a neighbor of the stack's cell.
    Your capping checker is dropped last, on top at the end of the path, so it takes over whatever stack is there.
    Each step goes to a neighboring cell, vacant or occupied.
    The path may come back to cells it has already passed, including the one it started from, but <b>never steps straight back</b> to the cell it just left.
    A stack of six or more can never be sown.
    To sow, click the stack and then each cell of the path.
  </p>
  <p>
    <b>Cap:</b> If you cap no stack of the rolled height, cap one of your stacks with a new checker instead.
    If you cap no stack at all, place on a vacant cell.
  </p>
  <p>
    <b>Free sows:</b> Each player has one free sow (zero to four, set in Setup).
    Instead of the move your roll gives, you may spend it to sow any stack you cap of height one to five, whatever the dice show: click Free sow, then the stack and its path.
    A free sow cannot stand in for a placement you are unable to make.
    The panel shows how many each player has left.
  </p>
  <p>
    No cell ever empties, so the board only fills.
    The game ends when you have no legal move, which is a double when no cell is vacant, even if you have free sows left.
  </p>
  <h3>Winning</h3>
  <p>
    You win if you cap the majority of the scoring corners when the game ends.
    The board is then full, so every scoring corner is capped.
  </p>
  <h3>Swap Rule</h3>
  <p>
    After Black's first turn, White may swap instead of rolling: Black's opening checker becomes White's, and Black rolls next.
    White decides before seeing the dice.
    The swap can be turned off in Setup.
  </p>
  <h3>Display</h3>
  <p>
    A stack is drawn as a pile of bars, the bottom checker lowest, on a cell shaded white or gray for the player who caps it.
    A stack of six or more, too tall to sow, has its height beside it.
    Dots mark the stacks you can sow or cap, and outlines the cells of the last move.
    The panel counts the scoring corners each player caps.
    Setup offers two other stack styles (Capped, where the top checker is a wider bar, and Plain, bars alone) and corner marks wrapped round the scoring corners.
  </p>
  <h3>Options</h3>
  <p>
    The board can be a triangle of side 3 to 10, or a hexagon of side 3 to 6.
    The number of free sows can also be changed in Setup.
  </p>
</template>

<script type="module">
  import { mount } from "../../common/shell.js";

  window.app = mount(game);
</script>
</body>
</html>
